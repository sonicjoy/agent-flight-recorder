name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres: # the same image as compose.yaml
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: afr
          POSTGRES_PASSWORD: afr # throwaway CI database, not a secret
          POSTGRES_DB: afr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afr -d afr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AFR_TEST_DATABASE_URL: postgresql+psycopg://afr:afr@127.0.0.1:5432/afr
      AFR_REQUIRE_DB: "1" # database tests fail here instead of skipping
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's commits to choose what to scan
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
