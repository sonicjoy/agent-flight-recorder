# Local Postgres with pgvector for the recorder.
#   docker compose up -d      start it
#   uv run alembic upgrade head   create the tables
# Port 5433 on the host, so it doesn't clash with a locally installed Postgres on 5432.
services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: afr
      POSTGRES_PASSWORD: afr # local development only; never used outside this machine
      POSTGRES_DB: afr
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - afr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afr -d afr"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  afr-db:
