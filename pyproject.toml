[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "Record, replay and analyse AI agent runs; turn failures into eval cases"
readme = "README.md"
authors = [
    { name = "Joe Luo", email = "sonicjoy2002@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "typer>=0.27.3",
]

[project.scripts]
afr = "flight_recorder.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flight_recorder"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not smoke'"
markers = [
    "smoke: real calls to LLM providers; run with `pytest -m smoke` (skipped without keys)",
    "db: needs Postgres (`docker compose up -d`); skipped without it unless AFR_REQUIRE_DB is set",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
