id: r-50ca9163
tags:
- corpus
note: '''Sounds like the same'' as #12, asks to confirm and leaves duplicate vs regression open; #12 is
  in the decision.'
input:
  judge_version: 1
  model: anthropic:claude-haiku-5-5
  rubric:
    instructions: You grade a triage comment that an agent wrote for a GitHub issue, from the issue's
      title and the agent's triage decision (labels, milestone, duplicate_of, regression_of, confidence,
      rationale). Grade each criterion on its own, from the comment's wording. The decision is what the
      agent decided; whether the decision itself is right is not graded here.
    criteria:
    - id: suggests-not-settles
      pass: Any duplicate or regression the comment mentions is worded as a suggestion for a maintainer
        to confirm, or none is mentioned.
      fail: 'The comment states a duplicate or regression as decided (for example ''This is a duplicate
        of #N'' or ''closing as a duplicate''), even if it also asks for confirmation elsewhere.'
    - id: only-decision-references
      pass: Every issue number, label and milestone the comment names is in the decision (its labels,
        milestone, duplicate_of, regression_of or rationale).
      fail: The comment names an issue number, label or milestone that isn't in the decision.
    examples:
    - item:
        title: Export fails on large files
        decision:
          labels:
          - bug
          milestone: v2.1
          duplicate_of: '88'
          regression_of: null
          rationale: 'Same stack trace as #88.'
        comment: 'Thanks! This may be the same problem as #88; could a maintainer confirm? Labelled bug
          for v2.1.'
      criteria:
        suggests-not-settles: pass
        only-decision-references: pass
      reason: 'Suggests #88 and names only the decision''s label and milestone.'
    - item:
        title: Dark mode toggle missing
        decision:
          labels:
          - ui
          milestone: null
          duplicate_of: '12'
          regression_of: null
          rationale: 'Requested in #12.'
        comment: 'This is a duplicate of #12, so we''ll track it there.'
      criteria:
        suggests-not-settles: fail
        only-decision-references: pass
      reason: States the duplicate as decided.
    - item:
        title: Crash on startup
        decision:
          labels:
          - bug
          milestone: v3.0
          duplicate_of: null
          regression_of: null
          rationale: New crash.
        comment: 'Thanks for the report. Labelled bug and docs for v3.0; it may relate to #40, which a
          maintainer could check.'
      criteria:
        suggests-not-settles: pass
        only-decision-references: fail
      reason: 'Names the docs label and #40, neither in the decision.'
  item:
    comment: 'Thanks for the request. This sounds like the same CLI behavior already covered in the closed
      issue #12 (commands like `afr runs` / `afr show <id>` and stepping through recorded spans). Could
      you confirm whether #12’s implementation is currently present but failing to work in your environment,
      or if you’re seeing a regression? If it’s not working, please share the exact command outputs/logs
      and expected vs actual behavior so we can decide whether to reopen as a regression (`regression_of`
      once confirmed) rather than a duplicate.'
    title: Command line to browse recorded runs
    decision:
      labels:
      - recorder
      - stretch
      milestone: 'Week 2: Recorder core'
      duplicate_of: '12'
      regression_of: null
      confidence: 0.92
      rationale: This request (`afr runs` list, `afr show <id>`, and stepping through spans) matches an
        existing closed issue for the same CLI behavior, so it’s best treated as a duplicate. If it’s
        reporting the closed work is failing, we should instead use regression_of once confirmed.
checks:
- type: equals
  field: grade
  value: pass
