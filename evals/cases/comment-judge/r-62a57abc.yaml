id: r-62a57abc
tags:
- corpus
note: 'Borderline: ''(listed as duplicate_of #30)'' reports the field but then asks whether #30 covers
  it; I read it as not settled. #30, labels and milestone are in the decision.'
input:
  judge_version: 1
  model: openai:gpt-5.4-mini
  rubric:
    instructions: 'You grade a triage comment that an agent wrote for a GitHub issue, from the issue''s
      title and the agent''s triage decision (labels, milestone, duplicate_of, regression_of, confidence,
      rationale). Grade each criterion on its own, from the comment''s wording. The decision is what the
      agent decided; whether the decision itself is right is not graded here. For suggests-not-settles,
      read each sentence about a duplicate or regression. Hedged or conditional wording is a suggestion
      (''looks like'', ''may be'', ''appears to'', ''could you confirm whether'', ''if it is the same,
      I recommend closing''), whoever is asked to confirm. A flat statement is decided (''This is a duplicate
      of #N'', ''This is a regression of #N'', ''marking as duplicate'', ''we are closing this''), and
      one such sentence fails the comment. For only-decision-references, check only three kinds of thing
      the comment names, namely issue numbers (#N), labels and milestones. Topics, questions, requests
      for details and anything else the comment talks about are never references and never fail it. The
      rationale is part of the decision, so an issue number, label or milestone that appears only in the
      rationale is in the decision.'
    criteria:
    - id: suggests-not-settles
      pass: Any duplicate or regression the comment mentions is worded as a suggestion for someone to
        confirm (hedged or conditional wording counts), or none is mentioned.
      fail: 'The comment states a duplicate or regression as decided (for example ''This is a duplicate
        of #N'', ''This is a regression of #N'' or ''closing as a duplicate''), even if it also asks for
        confirmation elsewhere.'
    - id: only-decision-references
      pass: Every issue number, label and milestone the comment names is in the decision (its labels,
        milestone, duplicate_of, regression_of or rationale). Other topics the comment raises don't count.
      fail: The comment names an issue number, label or milestone that isn't anywhere in the decision.
    examples:
    - item:
        title: Login times out after the update
        decision:
          labels:
          - bug
          - auth
          milestone: v4.2
          duplicate_of: null
          regression_of: '51'
          rationale: 'Worked before the session change in #51.'
        comment: 'Thanks for the report. This is a regression of #51. Could you share your browser version
          and the exact error? Labelled bug and auth for v4.2.'
      criteria:
        suggests-not-settles: fail
        only-decision-references: pass
      reason: 'States the regression of #51 as fact; asking for details afterwards doesn''t change that.'
    - item:
        title: Add CSV import
        decision:
          labels:
          - feature
          milestone: v5.0
          duplicate_of: '7'
          regression_of: null
          rationale: 'Same request as #7; #9 covers the export side.'
        comment: 'This looks like a duplicate of #7 (and is related to #9). Could you confirm whether
          you need anything beyond #7, such as other delimiters, large files or a progress bar? If it
          is the same, I recommend closing this one. Labelled feature for v5.0.'
      criteria:
        suggests-not-settles: pass
        only-decision-references: pass
      reason: 'Hedged and conditional, so the duplicate is only suggested. #7 and #9 are both in the decision
        (#9 in its rationale); delimiters, large files and a progress bar are topics, not references.'
    - item:
        title: Export fails on large files
        decision:
          labels:
          - bug
          milestone: v2.1
          duplicate_of: '88'
          regression_of: null
          rationale: 'Same stack trace as #88.'
        comment: 'Thanks! This may be the same problem as #88; could a maintainer confirm? Labelled bug
          for v2.1.'
      criteria:
        suggests-not-settles: pass
        only-decision-references: pass
      reason: 'Suggests #88 and names only the decision''s label and milestone.'
    - item:
        title: Dark mode toggle missing
        decision:
          labels:
          - ui
          milestone: null
          duplicate_of: '12'
          regression_of: null
          rationale: 'Requested in #12.'
        comment: 'This is a duplicate of #12, so we''ll track it there.'
      criteria:
        suggests-not-settles: fail
        only-decision-references: pass
      reason: States the duplicate as decided.
    - item:
        title: Crash on startup
        decision:
          labels:
          - bug
          milestone: v3.0
          duplicate_of: null
          regression_of: null
          rationale: New crash.
        comment: 'Thanks for the report. Labelled bug and docs for v3.0; it may relate to #40, which a
          maintainer could check.'
      criteria:
        suggests-not-settles: pass
        only-decision-references: fail
      reason: 'Names the docs label and #40, neither in the decision.'
  item:
    comment: 'Thanks for the report! This sounds like request to seed/test data for the triage agent.
      There’s already an open issue about seeding demo runs/quickstart (listed as duplicate_of #30); could
      you confirm whether that issue covers your needed test data as-is (including format and where it’s
      consumed by the agent)? If it doesn’t, please share what additional seed/fixture cases you want
      (e.g., label/milestone expectations, sample payloads, folder/schema), and we can align this with
      the Week 1 “Demo agent and foundations” documentation/demo-agent work. No regression is indicated.'
    title: Test data for the triage agent
    decision:
      labels:
      - documentation
      - demo-agent
      - stretch
      milestone: 'Week 1: Demo agent and foundations'
      duplicate_of: '30'
      regression_of: null
      confidence: 0.62
      rationale: Request is to seed/test data for the triage agent; there is already an open issue about
        seeding demo runs/quickstart, which likely covers this. If not, it extends documentation/seed
        tooling for the triager test cases, fitting early foundations.
checks:
- type: equals
  field: grade
  value: pass
